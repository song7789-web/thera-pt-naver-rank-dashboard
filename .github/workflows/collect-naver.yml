name: 네이버 실제 순위 수동 점검

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 수집 도구 준비
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 네이버 플레이스 실제 순위 점검
        run: node scripts/collect-naver.mjs
      - name: 수집 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json
          git diff --cached --quiet || (git commit -m "data: update naver rankings" && git push)
